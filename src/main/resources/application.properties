spring.application.name=wilkystorm

# Cache configuration (Caffeine is configured in CacheConfig.java)
spring.cache.cache-names=fredRogersQuote

# xAI / Grok API configuration. Set XAI_API_KEY outside source control.
xai.api.key=${XAI_API_KEY:}
grok.api.key=${GROK_API_KEY:}
xai.api.url=${XAI_API_URL:${GROK_API_URL:https://api.x.ai/v1}}
xai.model=${XAI_MODEL:${GROK_MODEL:grok-4.5}}

# Logging
logging.level.org.springframework.web=INFO
logging.level.com.example.wilkystorm=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} %-5level %logger{36} - %msg%n

# Server
server.port=8080
server.compression.enabled=true

# Actuator configuration - health endpoint only, no external service calls
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
