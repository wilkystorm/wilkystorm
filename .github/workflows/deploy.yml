name: Build and Deploy to EKS

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - master
    types:
      - opened
      - synchronize
      - reopened
      - closed

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  AWS_ACCOUNT_ID: "792028225466"
  ECR_REPOSITORY: wilkystorm
  EKS_CLUSTER_NAME: wilkystorm
  KUBE_NAMESPACE: default

jobs:
  build:
    if: ${{ github.event_name == 'push' || github.event.action != 'closed' || github.event.pull_request.merged == true }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.merged == true && 'master' || github.ref }}

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Run tests
        run: ./gradlew test

      - name: Run checks
        run: ./gradlew check

      - name: Build application
        run: ./gradlew bootJar

  deploy:
    if: ${{ github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.merged == true && github.event.pull_request.base.ref == 'master' }}
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout merged master
        uses: actions/checkout@v4
        with:
          ref: master

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Verify merged master build
        run: ./gradlew check

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::792028225466:role/wilkystorm-deploy-role
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push image to Amazon ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          IMAGE_TAG="$(git rev-parse HEAD)"
          IMAGE="$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          docker build -t "$IMAGE" .
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig --name ${{ env.EKS_CLUSTER_NAME }} --region ${{ env.AWS_REGION }}

      - name: Deploy to EKS
        run: |
          kubectl apply -f k8s/deployment.yaml
          kubectl apply -f k8s/service.yaml
          kubectl set image deployment/wilkystorm wilkystorm="${{ env.IMAGE }}" --namespace "${{ env.KUBE_NAMESPACE }}"
          kubectl rollout status deployment/wilkystorm --namespace "${{ env.KUBE_NAMESPACE }}" --timeout=180s
